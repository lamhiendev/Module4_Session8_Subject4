spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/doctor_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
server:
  port: 8082
resilience4j:
  ratelimiter:
    rate-limiter-aspect-order: 1
    instances:
      searchDoctorLimit:
        limit-for-period: 5
        limit-refresh-period: 10s
        timeout-duration: 0ms